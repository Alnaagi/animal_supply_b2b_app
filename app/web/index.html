  <script>
    (function restoreShopBranding() {
      try {
        var name = localStorage.getItem('shop_branding.v1.name');
        if (name) {
          name = String(name).trim();
          if (name) {
            document.title = name;
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', name);
          }
        }
        var logo = localStorage.getItem('shop_branding.v1.logo');
        if (logo) {
          logo = String(logo).trim();
          if (logo) {
            var favicons = document.querySelectorAll('link[rel*="icon"]');
            for (var i = 0; i < favicons.length; i++) {
              favicons[i].setAttribute('href', logo);
            }
            var appleIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
            for (var j = 0; j < appleIcons.length; j++) {
              appleIcons[j].setAttribute('href', logo);
            }
          }
        }
      } catch (e) {}
    })();
  </script>
  <!--
    Pre-Flutter loader: vertical paw trail walking bottom to top.
    Mirrors PawTrail in lib/src/core/widgets/paw_trail_loader.dart.
  -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--loader-bg, #f7f2ea);
      color: var(--loader-paw, #146c4e);
      transition: opacity .32s ease-out;
    }
    #app-loader.app-loader-done { opacity: 0; pointer-events: none; }
    #app-loader svg { width: 148px; height: 300px; overflow: visible; }
    #app-loader .app-loader-paw {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: appLoaderStep 2.1s ease-out 3 both;
    }
    #app-loader .app-loader-step:nth-child(1) .app-loader-paw { animation-delay: 0s; }
    #app-loader .app-loader-step:nth-child(2) .app-loader-paw { animation-delay: .22s; }
    #app-loader .app-loader-step:nth-child(3) .app-loader-paw { animation-delay: .44s; }
    #app-loader .app-loader-step:nth-child(4) .app-loader-paw { animation-delay: .66s; }
    #app-loader .app-loader-step:nth-child(5) .app-loader-paw { animation-delay: .88s; }
    #app-loader .app-loader-step:nth-child(6) .app-loader-paw { animation-delay: 1.1s; }
    #app-loader-name {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--loader-text, #173f32);
      text-align: center;
      padding: 0 24px;
    }
    @keyframes appLoaderStep {
      0%   { opacity: 0; transform: scale(.3); }
      10%  { opacity: 1; transform: scale(1.12); }
      18%  { opacity: 1; transform: scale(1); }
      55%  { opacity: 1; }
      80%  { opacity: 0.15; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .app-loader-paw {
        animation-name: appLoaderStepSoft;
      }
      @keyframes appLoaderStepSoft {
        0%, 100% { opacity: .2; transform: none; }
        35% { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>

  <script>
    (function appLoader() {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      try {
        var name = String(localStorage.getItem('shop_branding.v1.name') || '').trim();
        if (name) document.getElementById('app-loader-name').textContent = name;
      } catch (e) {}
      try {
        var theme = JSON.parse(localStorage.getItem('storefront_theme.v1') || 'null');
        if (theme && typeof theme === 'object') {
          var isHex = function (v) { return typeof v === 'string' && /^#[0-9A-Fa-f]{6}$/.test(v); };
          if (isHex(theme.backgroundColor)) loader.style.setProperty('--loader-bg', theme.backgroundColor);
          if (isHex(theme.primaryColor)) loader.style.setProperty('--loader-paw', theme.primaryColor);
          if (isHex(theme.textColor)) loader.style.setProperty('--loader-text', theme.textColor);
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta && isHex(theme.primaryColor)) themeMeta.setAttribute('content', theme.primaryColor);
        }
      } catch (e) {}

      var shownAt = Date.now();
      var minVisibleMs = 700;
      var removed = false;
      function hide() {
        if (removed) return;
        removed = true;
        var wait = Math.max(0, minVisibleMs - (Date.now() - shownAt));
        setTimeout(function () {
          loader.classList.add('app-loader-done');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 360);
        }, wait);
      }
      window.animalSupplyHideLoader = hide;
      window.addEventListener('flutter-first-frame', hide, { once: true });
      setTimeout(hide, 8000);
    })();
  </script>
