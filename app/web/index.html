<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة عربية لطلبات الجملة.">
  <meta name="theme-color" content="#168A63">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="المتجر">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>المتجر</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function restoreShopBranding() {
      try {
        var name = localStorage.getItem('shop_branding.v1.name');
        if (name) {
          name = String(name).trim();
          if (name) {
            document.title = name;
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', name);
          }
        }
        var logo = localStorage.getItem('shop_branding.v1.logo');
        if (logo) {
          logo = String(logo).trim();
          if (logo) {
            var favicons = document.querySelectorAll('link[rel*="icon"]');
            for (var i = 0; i < favicons.length; i++) {
              favicons[i].setAttribute('href', logo);
            }
            var appleIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
            for (var j = 0; j < appleIcons.length; j++) {
              appleIcons[j].setAttribute('href', logo);
            }
          }
        }
      } catch (e) {}
    })();
  </script>
  <!--
    Pre-Flutter loader: vertical paw trail walking bottom to top.
    Mirrors PawTrail in lib/src/core/widgets/paw_trail_loader.dart.
  -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--loader-bg, #f7f2ea);
      color: var(--loader-paw, #146c4e);
      transition: opacity .32s ease-out;
    }
    #app-loader.app-loader-done { opacity: 0; pointer-events: none; }
    #app-loader svg { width: 96px; height: 160px; overflow: visible; }
    #app-loader .app-loader-paw {
      opacity: 0;
      animation: appLoaderStep 2.4s ease-out infinite;
      animation-delay: calc(var(--i) * .3s);
    }
    #app-loader-name {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--loader-text, #173f32);
      text-align: center;
      padding: 0 24px;
    }
    @keyframes appLoaderStep {
      0%   { opacity: 0; transform: scale(.3); }
      10%  { opacity: 1; transform: scale(1.12); }
      18%  { opacity: 1; transform: scale(1); }
      55%  { opacity: 1; }
      80%, 100% { opacity: 0; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader .app-loader-paw { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-label="جارٍ تجهيز الصفحة...">
    <svg viewBox="0 0 96 160" aria-hidden="true">
      <defs>
        <g id="app-loader-paw-shape" fill="currentColor">
          <ellipse cx="0" cy="6.2" rx="9.7" ry="8.3"/>
          <ellipse cx="-10.4" cy="-5.5" rx="3.8" ry="4.8"/>
          <ellipse cx="-4.2" cy="-12.4" rx="3.8" ry="4.8"/>
          <ellipse cx="4.2" cy="-12.4" rx="3.8" ry="4.8"/>
          <ellipse cx="10.4" cy="-5.5" rx="3.8" ry="4.8"/>
        </g>
      </defs>
      <g transform="translate(65 138) rotate(11)"><use class="app-loader-paw" href="#app-loader-paw-shape" style="--i:0"/></g>
      <g transform="translate(31 99) rotate(-11)"><use class="app-loader-paw" href="#app-loader-paw-shape" style="--i:1"/></g>
      <g transform="translate(65 61) rotate(11)"><use class="app-loader-paw" href="#app-loader-paw-shape" style="--i:2"/></g>
      <g transform="translate(31 22) rotate(-11)"><use class="app-loader-paw" href="#app-loader-paw-shape" style="--i:3"/></g>
    </svg>
    <div id="app-loader-name"></div>
  </div>
  <script>
    (function appLoader() {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      try {
        var name = String(localStorage.getItem('shop_branding.v1.name') || '').trim();
        if (name) document.getElementById('app-loader-name').textContent = name;
      } catch (e) {}
      // Published storefront palette cached by applyShopWebTheme in Flutter.
      try {
        var theme = JSON.parse(localStorage.getItem('storefront_theme.v1') || 'null');
        if (theme && typeof theme === 'object') {
          var isHex = function (v) { return typeof v === 'string' && /^#[0-9A-Fa-f]{6}$/.test(v); };
          if (isHex(theme.backgroundColor)) loader.style.setProperty('--loader-bg', theme.backgroundColor);
          if (isHex(theme.primaryColor)) loader.style.setProperty('--loader-paw', theme.primaryColor);
          if (isHex(theme.textColor)) loader.style.setProperty('--loader-text', theme.textColor);
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta && isHex(theme.primaryColor)) themeMeta.setAttribute('content', theme.primaryColor);
        }
      } catch (e) {}

      var shownAt = Date.now();
      var minVisibleMs = 900;
      var removed = false;
      function hide() {
        if (removed) return;
        removed = true;
        var wait = Math.max(0, minVisibleMs - (Date.now() - shownAt));
        setTimeout(function () {
          loader.classList.add('app-loader-done');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 360);
        }, wait);
      }
      window.addEventListener('flutter-first-frame', hide, { once: true });
      // Never trap the page behind the loader if Flutter fails to boot.
      setTimeout(hide, 20000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="pwa_install.js"></script>
  <script src="firebase_bootstrap.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
