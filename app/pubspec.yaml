name: animal_supply_b2b
description: Animal Supply B2B mobile MVP for admin-created wholesale customers.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.8.0
  app_links: ^7.0.0
  package_info_plus: ^10.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  file_selector: ^1.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
