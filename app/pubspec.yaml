name: animal_supply_b2b
description: Animal Supply B2B mobile MVP for admin-created wholesale customers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
