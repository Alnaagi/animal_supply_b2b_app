project_id = "animal_supply_b2b_app"

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://animal-supply-b2b.alnaagi-ai.workers.dev"
additional_redirect_urls = [
  "https://animal-supply-b2b.alnaagi-ai.workers.dev/invite",
]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = ""

[auth.email]
# Email identities stay enabled so admin-created users can sign in.
# Public self-registration remains off via [auth] enable_signup = false.
enable_signup = true
enable_confirmations = false
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# This worker is authenticated inside the function with
# NOTIFICATION_DISPATCH_SECRET (or an exact active admin bearer token). Disabling
# gateway JWT verification allows a scheduled cron request to use the dedicated
# dispatch secret without exposing privileged database credentials.
[functions.dispatch-notification-outbox]
verify_jwt = false

[functions.send-notification-campaign]
verify_jwt = true

[functions.register-device-token]
verify_jwt = true

[functions.unregister-device-token]
verify_jwt = true

[functions.admin-reset-customer-device-binding]
verify_jwt = true

# Application-data wipe is admin-only. Gateway JWT stays on; the function also
# checks the caller profile role and requires confirm_phrase=RESET.
[functions.admin-reset-application-data]
verify_jwt = true

[functions.admin-update-order-pricing]
verify_jwt = true
